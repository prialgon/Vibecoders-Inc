<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css"/>
    <link rel="stylesheet" href="../css/normalize.css">
    <title>Demo</title>
</head>
<body class="layout">
    <header class="header center">
        <!-- <p>Header</p> -->
    </header>

    <main class="register center">
        <form class="center">
            <div class="window-header">
                <p class="window-header-text">Register</p>
                <img src="../imgs/close.png" class="close">
            </div>
            <div class="form-content" id="register-form">
                <h1 class="center">Create account</h1>

                <input id="email" type="email" name="email" placeholder="Email">

                <input id="password" type="password" name="password" placeholder="Password">

                <input id="password" type="password" name="password" placeholder="Re-enter password">

                <button type="submit" form="register-form">Create</button>
            </div>
        </form>
    </main>

    <footer class="footer center">
        <!-- <p>Footer</p> -->
    </footer>

</body>
</html>
