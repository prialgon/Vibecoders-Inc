<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css"/>
    <link rel="stylesheet" href="../css/normalize.css">
    <title>Demo</title>
</head>
<body class="layout">
    <header class="header center">
        <!-- <p>Header</p> -->
    </header>

    <main class="register center">
        <form class="center" id="register-form">
            <div class="window-header">
                <p class="window-header-text">Register</p>
                <img src="../imgs/close.png" class="close">
            </div>
            <div class="form-content" >
                <h1 class="center">Create account</h1>
                
                <input id="username" type="text" name="username" placeholder="Username">

                <input id="email" type="email" name="email" placeholder="Email">

                <input id="password1" type="password" name="password1" placeholder="Password">

                <input id="password2" type="password" name="password2" placeholder="Re-enter password">

                <p id="error-text" class="center"></p>

                <button type="submit" form="register-form">Create</button>

                <a href="login.html" class="center center-text-with-margin">Already have an account</a> 
            </div>
        </form>
    </main>

    <footer class="footer center">
        <p class="copyright">Copyright © 2026 Vibecoders Inc.</p>
    </footer>
    <script src="../scripts/script.js"></script>


</body>
</html>
