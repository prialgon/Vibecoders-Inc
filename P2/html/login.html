<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css"/>
    <link rel="stylesheet" href="../css/normalize.css">
    <title>Demo</title>
</head>
<body class="layout">
    <header class="header center">
        <!-- <p>Header</p> -->
    </header>

    <main class="register center">
        <form class="center">
            <div class="window-header">
                <p class="window-header-text">Login</p>
                <img src="../imgs/close.png" class="close">
            </div>
            <div class="form-content" id="login-form">
                <h1 class="center">Login</h1>
                <input type="email" name="email" placeholder="Email" id="email">
        
                <input type="password" placeholder="Password" name="password" id="password">

                <button type="submit" form="login-form">Login</button>

                <a href="" class="center center-forgot-password">Forgot password?</a> 

                <a href="register.html" class="center center-forgot-password">I don't have an account</a> 
            </div>
        </form>
    </main>

    <footer class="footer center">
        <p class="copyright">Copyright © 2026 Vibecoders Inc.</p>
    </footer>

</body>
</html>
